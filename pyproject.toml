[project]
name = "erp-hrm-core"
version = "1.0.0"
description = "ERP HRM / HRIS Core — the authoritative people, attendance, leave and payroll engine."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "gunicorn>=23.0.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "redis>=5.2.0",
    "structlog>=24.4.0",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.10.0",
    "python-multipart>=0.0.17",
    "email-validator>=2.2.0",
    "orjson>=3.10.0",
    "prometheus-client>=0.21.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.28.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.49b0",
    # Sync driver for Alembic. Migrations are a production operation, so this
    # must ship in the runtime image, not just in the dev group.
    "psycopg[binary]>=3.2.0",
]

[project.optional-dependencies]
sentry = ["sentry-sdk[fastapi]>=2.18.0"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "testcontainers[postgres]>=4.8.0",
    "factory-boy>=3.3.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "C4",       # comprehensions
    "DTZ",      # flake8-datetimez
    "T20",      # no print
    "SIM",      # simplify
    "RUF",      # ruff specific
    "ASYNC",    # async correctness
]
ignore = [
    "B008",   # FastAPI Depends() in defaults is idiomatic
    "N818",   # domain exception names are deliberate
]

# Prose in docstrings and error messages uses real typographic characters.
# These are intentional, not homoglyph smuggling.
allowed-confusables = ["–", "—", "×"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["T20", "RUF012", "ANN001"]
"app/scripts/*" = ["T20"]
"alembic/versions/*" = ["E501"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_generics = true
plugins = ["pydantic.mypy"]
exclude = ["^alembic/versions/"]

[[tool.mypy.overrides]]
module = [
    "testcontainers.*",
    "factory.*",
    "opentelemetry.*",
    "sentry_sdk.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
# Session-scoped engine and function-scoped tests must share one event loop,
# or asyncpg connections end up attached to a loop that has already closed.
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "unit: pure domain tests, no database",
    "integration: requires a real PostgreSQL instance",
    "api: exercises the HTTP layer",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/scripts/*", "alembic/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
