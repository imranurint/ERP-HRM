name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Test-only values. Real secrets never appear in CI configuration.
  SECRET_KEY: ci-secret-key-not-used-anywhere-real-0123456789
  APP_ENV: test
  DATABASE_URL: postgresql+asyncpg://hrm:hrm@localhost:5432/hrm_test
  REDIS_URL: redis://localhost:6379/0
  RATE_LIMIT_ENABLED: "false"
  LOG_JSON: "false"

jobs:
  quality:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --all-extras --dev

      - name: Ruff (lint)
        run: uv run ruff check app tests

      - name: Ruff (format)
        run: uv run ruff format --check app tests

      - name: mypy
        run: uv run mypy app

  test-unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --all-extras --dev

      # Unit tests are pure domain rules and touch no database, so they run
      # without a service container and fail fast.
      - name: Run unit tests
        run: uv run pytest tests/unit -m unit

  test-integration:
    name: Integration and API tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hrm
          POSTGRES_PASSWORD: hrm
          POSTGRES_DB: hrm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hrm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --all-extras --dev

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Run tests
        # The suite reuses the service container instead of starting
        # Testcontainers, which is faster and avoids docker-in-docker.
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://hrm:hrm@localhost:5432/hrm_test
          USE_EXISTING_DATABASE: "true"
        run: uv run pytest --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  docker:
    name: Build image
    runs-on: ubuntu-latest
    needs: [quality, test-unit, test-integration]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: erp-hrm-core:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The app reads its settings at import time and refuses to start without
      # them, so the smoke test has to supply a (throwaway) configuration.
      - name: Smoke test the image
        run: |
          docker run --rm \
            -e SECRET_KEY=ci-smoke-test-key-not-used-anywhere-real-0123456789 \
            -e DATABASE_URL=postgresql+asyncpg://u:p@localhost:5432/db \
            --entrypoint python erp-hrm-core:${{ github.sha }} \
            -c "import app.main; print('import ok:', len(app.main.app.routes), 'routes')"

      # Publishing only happens on the default branch.
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
